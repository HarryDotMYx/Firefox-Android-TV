import org.mozilla.gradle.Dependencies

buildscript {
    ext.androidx_version = '1.7.0'
    ext.architecture_components_version = '2.8.6'
    ext.kotlin_version = '2.2.10'
    ext.coroutines_version = '1.8.1'
    ext.moz_components_version = '24.0.1'
    ext.androidx_work_version = '2.9.1'
    ext.adm_version = '1.0.1'
    ext.oss_licenses_version = '17.1.0'

    ext.robolectric_version = '4.13'

    ext.test_core = '1.6.1'
    ext.test_runner = '1.6.2'
    ext.test_rules = ext.test_runner
    ext.test_orchestrator = '1.5.0'
    ext.espresso_version = '3.6.1'
    ext.uiautomator_version = '2.3.0'
    ext.junit = "1.2.1"

    repositories {
        mavenCentral()
        google()
        maven {
            url "https://maven.mozilla.org/maven2"
            content {
                includeGroupByRegex Dependencies.RepoMatching.mozilla
            }
        }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.android.gms:oss-licenses-plugin:0.10.6'
    }
}

plugins {
    id "io.gitlab.arturbosch.detekt" version "1.23.7"
}

detekt {
    toolVersion = "1.23.7"
    source.setFrom(files("$projectDir"))
    config.setFrom(files("$projectDir/quality/detekt.yml"))
    buildUponDefaultConfig = true
}

allprojects {
    repositories {
        mavenCentral()
        google()
        maven {
            url "https://maven.mozilla.org/maven2"
            content {
                includeGroupByRegex Dependencies.RepoMatching.mozilla
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.layout.buildDirectory
}
