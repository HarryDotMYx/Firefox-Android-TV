import org.mozilla.gradle.Dependencies

buildscript {
    ext.androidx_version = '1.7.1'
    ext.architecture_components_version = '2.10.0'
    ext.kotlin_version = '2.3.21'
    ext.coroutines_version = '1.10.2'
    ext.moz_components_version = '24.0.1'
    ext.androidx_work_version = '2.11.1'
    ext.adm_version = '1.0.1'
    ext.oss_licenses_version = '17.1.0'

    ext.robolectric_version = '4.16.1'

    ext.test_core = '1.7.0'
    ext.test_runner = '1.7.0'
    ext.test_rules = '1.7.0'
    ext.test_orchestrator = '1.6.1'
    ext.espresso_version = '3.7.0'
    ext.uiautomator_version = '2.3.0'
    ext.junit = "1.3.0"

    repositories {
        google()
        mavenCentral()
        maven {
            url "https://maven.mozilla.org/maven2/"
        }
    }

    dependencies {
        
        
    }
}

plugins {
    id 'com.android.application' version '9.2.0' apply false
    id 'org.jetbrains.kotlin.android' version '2.3.21' apply false
    id 'org.jetbrains.kotlin.kapt' version '2.3.21' apply false
    id 'com.google.android.gms.oss-licenses-plugin' version '0.12.0' apply false
    id "io.gitlab.arturbosch.detekt" version "1.23.7"
}

detekt {
    toolVersion = "1.23.7"
    source.setFrom(files("$projectDir"))
    config.setFrom(files("$projectDir/quality/detekt.yml"))
    buildUponDefaultConfig = true
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url "https://maven.mozilla.org/maven2/"
        }
    }
}

task clean(type: Delete) {
    delete rootProject.layout.buildDirectory
}

