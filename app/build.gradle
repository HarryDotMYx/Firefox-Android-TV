apply plugin: 'com.android.application'
apply plugin: 'com.google.android.gms.oss-licenses-plugin'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

android {
    compileSdk 34
    namespace "org.mozilla.tv.firefox"

    defaultConfig {
        applicationId "org.mozilla.tv.firefox"
        minSdk 34
        targetSdk 34
        versionCode 11
        versionName "4.8-PGMAFX"
        testInstrumentationRunner "org.mozilla.tv.firefox.FirefoxOnDeviceTestRunner"
        testInstrumentationRunnerArguments clearPackageData: 'true'

        multiDexEnabled true

        ndk {
            abiFilters 'armeabi-v7a', 'x86', 'arm64-v8a', 'x86_64'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    lint {
        lintConfig file("lint.xml")
        baseline file("lint-baseline.xml")
        warningsAsErrors true
        abortOnError true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    flavorDimensions = ["engine"]

    productFlavors {
        system {
            dimension "engine"
        }

        gecko {
            dimension "engine"
            applicationIdSuffix ".gecko"
        }
    }

    /*
    testOptions {
        unitTests.includeAndroidResources = true
        execution 'ANDROIDX_TEST_ORCHESTRATOR'
    }
    */

    sourceSets {
        test {
            resources {
                srcDir "${projectDir}/src/main/assets/"
            }
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/proguard/androidx-annotations.pro', 'META-INF/atomicfu.kotlin_module']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
        allWarningsAsErrors = true
    }
}

configurations {
    systemImplementation {}
    geckoImplementation {}
}

